# Publishes OliverHesse.DataCodec to nuget.org when a version tag (e.g. v0.1.0) is pushed.
# Uses NuGet trusted publishing: no API key is stored; see the policy on nuget.org for this workflow file.
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # needed for NuGet trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: >
          dotnet pack src/DataCodec/DataCodec.csproj -c Release -o artifacts
          -p:Version=${GITHUB_REF_NAME#v}
          -p:ContinuousIntegrationBuild=true

      - name: Log in to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
